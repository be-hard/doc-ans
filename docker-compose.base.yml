services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: docs-ans
      POSTGRES_PASSWORD: docs-ans
      POSTGRES_DB: docs-ans
    ports:
      - "${POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7
    ports:
      - "${REDIS_HOST_PORT:-16379}:6379"
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.11.5
    ports:
      - "${QDRANT_HOST_PORT:-16333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
